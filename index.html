<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Planner + Recipe Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.0/babel.min.js"></script>
<style>
:root{--bg:#cad4ba;--tab:#b8c4a8;--ink:#3b453b;--line:#7f8475;--hl:#dfe8d2;--card:#d5dec9;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#222a23;--tab:#2b352c;--ink:#d2dcc7;--line:#7d8b7a;--hl:#35423a;--card:#2a332b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#222a23;--tab:#2b352c;--ink:#d2dcc7;--line:#7d8b7a;--hl:#35423a;--card:#2a332b;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Roboto Mono',ui-monospace,monospace;font-size:14px;margin:0}
.hd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.u{text-decoration:underline;text-underline-offset:3px;text-transform:uppercase;letter-spacing:.06em}
.box{border:1px solid var(--line)}
.btn{border:1px solid var(--line);padding:.35rem .7rem;background:transparent;color:inherit;font:inherit;cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
.btn:hover{background:var(--hl)}
.btn.pri{background:var(--ink);color:var(--bg)}
.ic{padding:.35rem}
.inp{width:100%;background:var(--card);border:1px solid var(--line);padding:.4rem .5rem;color:inherit;font:inherit;border-radius:0}
.tab{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:1.05rem;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:.45rem 1.1rem;background:var(--tab);color:inherit;cursor:pointer;position:relative;white-space:nowrap}
.tab.on{background:var(--bg);margin-bottom:-1px;padding-bottom:calc(.45rem + 1px)}
.panel{border:1px solid var(--line);background:var(--bg)}
.meal{border:1px solid var(--line);background:var(--card);padding:.4rem .55rem;margin-bottom:.35rem;cursor:pointer}
.meal small{display:block;opacity:.75;font-style:italic}
.meal{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.g{border-top:1px solid var(--line);border-left:1px solid var(--line);overflow-x:auto;display:flex}
.c{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:480px){.tab{padding:.4rem .6rem;font-size:.95rem}}
.today{background:var(--hl);outline:2px solid var(--ink);outline-offset:-2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.mod{background:var(--bg);border:1px solid var(--line);max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:1.25rem}
.over{outline:2px dashed var(--ink);outline-offset:-4px}
.nm{background:transparent;border:0;border-bottom:1px dashed transparent;color:inherit;font:inherit;font-size:.8rem;letter-spacing:.1em;text-align:center;width:100%;max-width:20rem;padding:0}
.nm:hover,.nm:focus{border-bottom-color:var(--line)}
.meal{position:relative}
.mdel{position:absolute;top:.2rem;right:.2rem;background:none;border:0;color:inherit;padding:.1rem;cursor:pointer;line-height:0;opacity:.7}
.mdel:hover{opacity:1}
@media(hover:hover){.mdel{opacity:0}.meal:hover .mdel,.mdel:focus-visible{opacity:1}}
.shop-btn{opacity:1}
@media(hover:hover){.shop-btn{opacity:0;transition:opacity .15s}.c:hover .shop-btn,.shop-btn:focus-visible,.shop-btn[aria-pressed="true"]{opacity:1}}
@media(hover:hover){.paste-btn{opacity:0;transition:opacity .15s}.c:hover .paste-btn,.paste-btn:focus-visible{opacity:1}}
.tag{display:inline-flex;align-items:center;gap:.25rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem;font:inherit;font-size:.75rem;line-height:1.4;background:var(--card);color:inherit}
.tag.on{background:var(--ink);color:var(--bg)}
.meal.combo{border-left-width:4px}
.mcopy{position:absolute;top:.2rem;right:1.6rem;background:none;border:0;color:inherit;padding:.1rem;cursor:pointer;line-height:0;opacity:.7}
.mcopy:hover{opacity:1}
@media(hover:hover){.mcopy{opacity:0}.meal:hover .mcopy,.mcopy:focus-visible{opacity:1}}
.ptable{border-collapse:collapse;width:100%}
.ptable th,.ptable td{border:1px solid var(--line);padding:.4rem .5rem;vertical-align:top;text-align:left}
.ptable td{height:3.2rem;min-width:110px}
@media print{
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#fff;--ink:#000;--line:#555;--card:#fff;--hl:#eee;padding:0}
body{background:#fff}
#root>div>*:not(.ov){display:none!important}
.ov{position:static;display:block;background:none;padding:0}
.mod{border:0;max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}
.noprint{display:none!important}
}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS=[['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s','Snacks']];
const KEY='menuPlanner.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const emptyWeek=()=>{const w={};DAYS.forEach((_,i)=>{w[i]={b:[],l:[],d:[],s:[]}});return w;};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const SAMPLES=[
 {id:'r1',name:'Macaroni and cheese',ings:[{id:'a1',name:'Elbow macaroni',qty:'1 lb'},{id:'a2',name:'Cheddar',qty:'2 cups'},{id:'a3',name:'Milk',qty:'2 cups'}],notes:'Bake 20 minutes for a crispy top.'},
 {id:'r2',name:'Chicken tacos',ings:[{id:'b1',name:'Chicken breast',qty:'1 lb'},{id:'b2',name:'Tortillas',qty:'8'},{id:'b3',name:'Salsa',qty:'1 cup'}],notes:'Season chicken with cumin and chili powder.'},
 {id:'r3',name:'Omelette',ings:[{id:'c1',name:'Eggs',qty:'3'},{id:'c2',name:'Cheddar',qty:'0.5 cups'}],notes:'Optional add-ins: peppers, ham, spinach.'}
];
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d);};
const dayIdx=(ws,d)=>Math.round((new Date(d+'T00:00')-new Date(ws+'T00:00'))/864e5);
const mealRids=m=>m.rid?[m.rid]:(m.items||[]).map(i=>i.rid).filter(Boolean);
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function settle(st,from,to){
  const last=st.lastDone||'';let a=last&&addDays(last,1)>from?addDays(last,1):from;
  const end=addDays(st.weekStart,6);const b=to>end?end:to;
  if(a<st.weekStart)a=st.weekStart;
  if(a>b)return st;
  const hist={};
  for(let d=a;d<=b;d=addDays(d,1)){const w=st.thisWeek[dayIdx(st.weekStart,d)];SLOTS.forEach(([k])=>w[k].forEach(m=>mealRids(m).forEach(rid=>{(hist[rid]=hist[rid]||new Set()).add(d);})));}
  const recipes=st.recipes.map(r=>{const add=hist[r.id];if(!add)return r;const h=[...(r.history||[])];add.forEach(d=>{if(!h.includes(d))h.push(d);});h.sort();return{...r,history:h};});
  return{...st,recipes,lastDone:b>last?b:last};
}
function advance(st){
  const cur=iso(monday(new Date()));const y=addDays(iso(new Date()),-1);
  let s=st;const lim=addDays(s.weekStart,6);
  s=settle(s,s.weekStart,y<lim?y:lim);
  const diff=Math.round((new Date(cur+'T00:00')-new Date(s.weekStart+'T00:00'))/(7*864e5));
  if(diff>=1)s={...s,thisWeek:diff===1?s.nextWeek:emptyWeek(),nextWeek:emptyWeek(),weekStart:cur,shop:[]};
  return settle(s,s.weekStart,y);
}
function load(){
  const cur=monday(new Date());let st=null;
  try{st=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!st||!st.recipes)return{recipes:SAMPLES,thisWeek:emptyWeek(),nextWeek:emptyWeek(),weekStart:iso(cur)};
  return advance(st);
}
const dayLabel=(ws,i,wk)=>{const d=new Date(ws+'T00:00');d.setDate(d.getDate()+i+(wk==='nextWeek'?7:0));return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});};
const Ic=({d,s=18,f})=><svg width={s} height={s} viewBox="0 0 24 24" fill={f?'currentColor':'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={d}/></svg>;
const P={plus:'M12 5v14M5 12h14',chev:'M6 9l6 6 6-6',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6',cal:'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5',x:'M6 6l12 12M18 6L6 18',cart:'M3 4h2l2.5 11h11L21 7H6M9 20h.01M17 20h.01',eye:'M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zM12 9a3 3 0 100 6 3 3 0 000-6z',sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',star:'M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z',print:'M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z',filter:'M3 4h18l-7 9v6l-4 2v-8z',bookmark:'M6 3h12v18l-6-4-6 4z',copy:'M8 8h12v12H8zM4 16V4h12',paste:'M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2M9 2h6v4H9z'};

function Modal({title,onClose,wide,minH,children}){
  const ref=React.useRef(null);
  useEffect(()=>{const k=e=>{if(e.key!=='Escape')return;const all=document.querySelectorAll('.ov');if(all[all.length-1]===ref.current)onClose();};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k);},[]);
  return <div className="ov" ref={ref} onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
    <div className="mod" style={{...(wide?{maxWidth:wide===true?'760px':wide}:null),...(minH?{minHeight:minH,display:'flex',flexDirection:'column'}:null)}} role="dialog" aria-modal="true" aria-label={title}>
      <div className="flex items-center justify-between mb-3"><h2 className="hd text-2xl">{title}</h2><button className="btn ic noprint" onClick={onClose} aria-label="Close"><Ic d={P.x}/></button></div>
      {children}
    </div></div>;
}
const Field=({label,children})=><label className="block mb-3"><span className="u text-xs block mb-1">{label}</span>{children}</label>;
const LIST_CLS="box overflow-auto";
function useDrop(open,wr){
  const [st,setSt]=useState(null);
  React.useLayoutEffect(()=>{
    if(!open)return;
    const upd=()=>{const el=wr.current;if(!el)return;const r=el.getBoundingClientRect();const below=window.innerHeight-r.bottom-8,above=r.top-8;const up=below<140&&above>below;
      setSt({position:'fixed',left:r.left,width:r.width,maxHeight:Math.max(80,Math.min(176,up?above:below)),...(up?{bottom:window.innerHeight-r.top}:{top:r.bottom}),background:'var(--card)',zIndex:60});};
    upd();window.addEventListener('resize',upd);window.addEventListener('scroll',upd,true);
    return()=>{window.removeEventListener('resize',upd);window.removeEventListener('scroll',upd,true);};
  },[open]);
  return st;
}
const OPT_CLS="px-2 py-1 cursor-pointer hover:opacity-70 flex justify-between gap-2";
function Select({value,onChange,options,label}){
  const [open,setOpen]=useState(false);const [hi,setHi]=useState(0);const lr=React.useRef(null);const wr=React.useRef(null);const ls=useDrop(open,wr);
  const idx=Math.max(0,options.findIndex(o=>o.value===value));const cur=options[idx];
  useEffect(()=>{if(!open||!lr.current)return;const el=lr.current.children[hi];if(el)el.scrollIntoView({block:'nearest'});},[open,hi]);
  const openIt=()=>{setHi(idx);setOpen(true);};
  const pick=o=>{onChange(o.value);setOpen(false);};
  const kd=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)openIt();else setHi(h=>Math.min(options.length-1,Math.max(0,h+(e.key==='ArrowDown'?1:-1))));}
    else if(e.key==='Home'&&open){e.preventDefault();setHi(0);}
    else if(e.key==='End'&&open){e.preventDefault();setHi(options.length-1);}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(open)pick(options[hi]);else openIt();}
    else if(e.key==='Escape'&&open){e.preventDefault();e.stopPropagation();setOpen(false);}
  };
  return <div className="relative" ref={wr}>
    <button type="button" className="inp flex items-center justify-between gap-2 text-left cursor-pointer" role="combobox" aria-haspopup="listbox" aria-expanded={open} aria-label={label} onClick={()=>open?setOpen(false):openIt()} onBlur={()=>setOpen(false)} onKeyDown={kd}><span>{cur&&cur.label}</span><Ic d={P.chev} s={14}/></button>
    {open&&ls&&<ul ref={lr} className={LIST_CLS} style={ls} role="listbox" onMouseDown={e=>e.preventDefault()} onClick={e=>e.preventDefault()}>
      {options.map((o,j)=><li key={o.value} role="option" aria-selected={o.value===value} className={OPT_CLS} style={o.value===value?{background:'var(--hl)'}:j===hi?{outline:'1px solid var(--line)',outlineOffset:'-1px'}:null} onMouseEnter={()=>setHi(j)} onMouseDown={e=>{e.preventDefault();pick(o);}}><span>{o.label}</span></li>)}
    </ul>}
  </div>;
}
function Suggest({value,onChange,onSubmit,onPick,options,placeholder,label,autoFocus}){
  const [open,setOpen]=useState(false);const [hi,setHi]=useState(-1);const lr=React.useRef(null);const wr=React.useRef(null);const ls=useDrop(open,wr);
  const q=value.trim().toLowerCase();const matches=options.filter(o=>o.toLowerCase().includes(q));
  useEffect(()=>{if(!open||!lr.current||hi<0)return;const el=lr.current.children[hi];if(el)el.scrollIntoView({block:'nearest'});},[open,hi]);
  const pick=o=>{onPick(o);setOpen(false);setHi(-1);};
  const kd=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!matches.length)return;e.preventDefault();if(!open){setOpen(true);setHi(e.key==='ArrowDown'?0:matches.length-1);}else setHi(h=>e.key==='ArrowDown'?Math.min(matches.length-1,h+1):Math.max(0,h-1));}
    else if(e.key==='Enter'){e.preventDefault();if(open&&hi>=0&&matches[hi])pick(matches[hi]);else onSubmit();}
    else if(e.key==='Escape'&&open){e.preventDefault();e.stopPropagation();setOpen(false);}
  };
  return <div className="relative flex-1" ref={wr}>
    <input className="inp" autoFocus={autoFocus} role="combobox" aria-expanded={open&&matches.length>0} aria-label={label} placeholder={placeholder} value={value} onFocus={()=>setOpen(true)} onBlur={()=>setOpen(false)} onChange={e=>{onChange(e.target.value);setHi(-1);setOpen(true);}} onKeyDown={kd}/>
    {open&&ls&&matches.length>0&&<ul ref={lr} className={LIST_CLS} style={ls} role="listbox" onMouseDown={e=>e.preventDefault()}>
      {matches.map((o,j)=><li key={o} role="option" aria-selected={j===hi} className={OPT_CLS} style={j===hi?{background:'var(--hl)'}:null} onMouseEnter={()=>setHi(j)} onMouseDown={e=>{e.preventDefault();pick(o);}}><span>{o}</span></li>)}
    </ul>}
  </div>;
}
const DAY_OPTS=DAYS.map((d,i)=>({value:i,label:d}));
const SLOT_OPTS=SLOTS.map(([k,n])=>({value:k,label:n}));
const DaySlot=({day,slot,setDay,setSlot})=><div className="grid grid-cols-2 gap-2">
  <div className="mb-3"><span className="u text-xs block mb-1">Day</span><Select label="Day" value={day} onChange={setDay} options={DAY_OPTS}/></div>
  <div className="mb-3"><span className="u text-xs block mb-1">Meal</span><Select label="Meal" value={slot} onChange={setSlot} options={SLOT_OPTS}/></div></div>;

function RecipeView({r,onClose}){
  return <Modal title={r.name} wide onClose={onClose}>
    {(r.tags||[]).length>0&&<div className="flex flex-wrap gap-1 mb-3">{r.tags.map(t=><span key={t} className="tag">{t}</span>)}</div>}
    <span className="u text-xs block mb-1">Ingredients</span>
    {r.ings.length?<ul className="mb-3">{r.ings.map(i=><li key={i.id}>{i.qty} {i.name}</li>)}</ul>:<p className="mb-3 italic">No ingredients saved.</p>}
    <span className="u text-xs block mb-1">Prep notes</span>
    <p className="whitespace-pre-wrap">{r.notes||'No prep notes saved.'}</p>
    <div className="mt-3"><span className="u text-xs block mb-1">Cooked history</span>
      <p className="mb-2">Cooked {(r.history||[]).length} time{(r.history||[]).length===1?'':'s'}</p>
      {(r.history||[]).length>0?<ul className="flex flex-wrap gap-1">{[...(r.history||[])].sort().reverse().map(d=><li key={d} className="tag">{fmtDate(d)}</li>)}</ul>:<p className="text-xs italic">No cooked dates yet. A meal is counted automatically once its day has passed.</p>}
    </div>
  </Modal>;
}
function AddModal({init,recipes,combos=[],onAdd,onClose}){
  const opts=[...recipes.map(r=>({key:'r:'+r.id,kind:'r',id:r.id,name:r.name})),...combos.map(c=>({key:'c:'+c.id,kind:'c',id:c.id,name:c.name,items:c.items}))].sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));
  const k0=init.rid?'r:'+init.rid:init.cid?'c:'+init.cid:'';
  const [rid,setRid]=useState(k0);const [name,setName]=useState((opts.find(o=>o.key===k0)||{name:''}).name);const [open,setOpen]=useState(false);const skipOpen=React.useRef(!!k0);const wr=React.useRef(null);const ls=useDrop(open,wr);
  const q=name.trim().toLowerCase();const matches=rid?opts:opts.filter(o=>o.name.toLowerCase().includes(q));
  const pick=o=>{setRid(o.key);setName(o.name);setOpen(false);};
  const [day,setDay]=useState(init.day);const [slot,setSlot]=useState(init.slot);
  const go=()=>{const o=opts.find(x=>x.key===rid);let m;if(o&&o.kind==='r')m={name:o.name,rid:o.id,note:''};else if(o)m={name:o.name,cid:o.id,items:o.items,note:''};else{const n=name.trim();if(!n)return;m={name:n,rid:null,note:''};}onAdd(init.wk,day,slot,m);onClose();};
  return <Modal title="Add a meal" onClose={onClose}>
    <Field label="Recipe or meal"><div className="relative" ref={wr}>
      <input className="inp" autoFocus role="combobox" aria-expanded={open} placeholder="Search recipes or type a custom meal" value={name}
        onFocus={()=>{if(skipOpen.current){skipOpen.current=false;return;}setOpen(true);}} onClick={()=>setOpen(true)} onBlur={()=>setOpen(false)}
        onChange={e=>{setName(e.target.value);setRid('');setOpen(true);}}
        onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(open&&!rid&&matches.length&&name.trim())pick(matches[0]);else go();}}}/>
      {open&&ls&&<ul className="box overflow-auto" style={ls} role="listbox" onMouseDown={e=>e.preventDefault()}>
        {matches.map(r=><li key={r.key} role="option" aria-selected={r.key===rid} className="px-2 py-1 cursor-pointer hover:opacity-70 flex justify-between gap-2" style={r.key===rid?{background:'var(--hl)'}:null} onMouseDown={e=>{e.preventDefault();pick(r);}}><span>{r.name}</span>{r.kind==='c'&&<span className="tag">Combo</span>}</li>)}
        {!matches.length&&<li className="px-2 py-1 italic">{name.trim()?'No recipe found. “'+name.trim()+'” will be added as a custom meal.':'No recipes yet. Type a custom meal.'}</li>}
      </ul>}
    </div></Field>
    <DaySlot day={day} slot={slot} setDay={setDay} setSlot={setSlot}/>
    <div className="flex justify-end gap-2"><button className="btn" onClick={onClose}>Cancel</button><button className="btn pri" onClick={go}>Add meal</button></div>
  </Modal>;
}
function EditModal({init,recipes,onView,onSave,onDelete,onClose}){
  const rec=init.meal.rid?recipes.find(r=>r.id===init.meal.rid):null;
  const [name,setName]=useState(init.meal.name);const [note,setNote]=useState(init.meal.note||'');
  const [day,setDay]=useState(init.day);const [slot,setSlot]=useState(init.slot);
  return <Modal title="Edit meal" onClose={onClose}>

  const [s,setS]=useState(load);const [tab,setTab]=useState('this');const [modal,setModal]=useState(null);const [view,setView]=useState(null);const [toast,setToast]=useState(null);const [clip,setClip]=useState(null);const [,setNow]=useState(0);
  useEffect(()=>{const t=()=>{setS(p=>advance(p));setNow(n=>n+1);};const id=setInterval(t,60000);document.addEventListener('visibilitychange',t);return()=>{clearInterval(id);document.removeEventListener('visibilitychange',t);};},[]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),6000);return()=>clearTimeout(t);},[toast]);
  const [theme,setTheme]=useState(()=>{try{const t=localStorage.getItem('menuPlanner.theme');if(t)return t;}catch(e){}return window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';});
  useEffect(()=>{document.documentElement.dataset.theme=theme;try{localStorage.setItem('menuPlanner.theme',theme);}catch(e){}},[theme]);
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}},[s]);
  const today=(new Date().getDay()+6)%7;
  const edit=(wk,fn)=>setS(p=>{const w=JSON.parse(JSON.stringify(p[wk]));fn(w);return{...p,[wk]:w};});
  const addMeal=(wk,d,sl,m)=>edit(wk,w=>{w[d][sl].push({id:uid(),...m});});
  const moveMeal=wk=>(fd,fs,id,td,ts,patch)=>edit(wk,w=>{const m=w[fd][fs].find(x=>x.id===id);if(!m)return;w[fd][fs]=w[fd][fs].filter(x=>x.id!==id);w[td][ts].push({...m,...patch});});
  const rm=(wk,d,sl,id)=>edit(wk,w=>{w[d][sl]=w[d][sl].filter(x=>x.id!==id);});
  const removeMeal=(wk,d,sl,meal)=>{rm(wk,d,sl,meal.id);setToast({wk,d,sl,meal,k:uid()});};
  const undo=()=>{if(!toast)return;edit(toast.wk,w=>{w[toast.d][toast.sl].push(toast.meal);});setToast(null);};
  const saveRecipe=r=>setS(p=>({...p,recipes:p.recipes.some(x=>x.id===r.id)?p.recipes.map(x=>x.id===r.id?r:x):[...p.recipes,r]}));
  const toggleShop=i=>setS(p=>{const a=p.shop||[];return{...p,shop:a.includes(i)?a.filter(x=>x!==i):[...a,i]};});
  const pasteMeal=(wk,d,sl)=>{if(!clip)return;const {id:_x,...rest}=clip;addMeal(wk,d,sl,rest);};
  const setHistory=(id,h)=>setS(p=>({...p,recipes:p.recipes.map(x=>x.id===id?{...x,history:h}:x)}));
  const saveCombo=c=>setS(p=>{const a=p.combos||[];return{...p,combos:a.some(x=>x.id===c.id)?a.map(x=>x.id===c.id?c:x):[...a,c]};});
  const delCombo=id=>setS(p=>({...p,combos:(p.combos||[]).filter(c=>c.id!==id)}));
  const toggleFav=id=>setS(p=>({...p,recipes:p.recipes.map(r=>r.id===id?{...r,fav:!r.fav}:r)}));
  const delRecipe=id=>setS(p=>({...p,recipes:p.recipes.filter(r=>r.id!==id)}));
  const close=()=>setModal(null);
  const allTags=[...new Map(s.recipes.flatMap(r=>r.tags||[]).map(x=>[x.toLowerCase(),x])).values()].sort((a,b)=>a.localeCompare(b));
  const TABS=[['this','This Week'],['next','Next Week'],['add','Add Recipe'],['book','Recipe Book'],['combos','Combos']];
  const wkOf=m=>m.wk;
  return <div className="max-w-7xl mx-auto p-3 sm:px-6 sm:py-4 flex flex-col" style={{minHeight:'calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))'}}>
    <header className="box text-center py-1.5 mb-3">
      <input className="nm" aria-label="Names of the people using this planner" title="Click to edit your names" value={s.names??'Add your names'} onFocus={e=>e.target.select()} onChange={e=>setS(p=>({...p,names:e.target.value}))} onBlur={e=>{if(!e.target.value.trim())setS(p=>({...p,names:'Add your names'}));}}/>
      <h1 className="hd text-2xl sm:text-3xl leading-none mt-0.5">Menu Planner + Recipe Book</h1>
    </header>
    <nav className="flex flex-wrap gap-1 px-2" role="tablist">
      {TABS.map(([k,n])=><button key={k} role="tab" aria-selected={tab===k} className={'tab '+(tab===k?'on':'')} onClick={()=>setTab(k)}>{n}</button>)}
      <div className="ml-auto self-center flex gap-1"><button className="btn ic" style={{padding:'.2rem'}} title="Print this week’s menu" aria-label="Print this week’s menu" onClick={()=>setModal({t:'print'})}><Ic d={P.print} s={15}/></button><button className="btn ic" style={{padding:'.2rem'}} title={theme==='dark'?'Switch to light mode':'Switch to dark mode'} aria-label={theme==='dark'?'Switch to light mode':'Switch to dark mode'} onClick={()=>setTheme(theme==='dark'?'light':'dark')}><Ic d={theme==='dark'?P.sun:P.moon} s={15}/></button></div>
    </nav>
    <main className="panel flex flex-col flex-1">
      {tab==='this'&&<WeekView wk="thisWeek" s={s} today={today} onMove={moveMeal('thisWeek')} shop={s.shop||[]} onShop={toggleShop} clip={clip} onCopy={setClip} onClear={()=>setClip(null)} onPaste={(d,sl)=>pasteMeal('thisWeek',d,sl)} onRemove={(d,sl,m)=>removeMeal('thisWeek',d,sl,m)} onAdd={i=>setModal({t:'add',...i})} onEdit={i=>setModal({t:'edit',...i})}/>}
      {tab==='next'&&<WeekView wk="nextWeek" s={s} onMove={moveMeal('nextWeek')} clip={clip} onCopy={setClip} onClear={()=>setClip(null)} onPaste={(d,sl)=>pasteMeal('nextWeek',d,sl)} onRemove={(d,sl,m)=>removeMeal('nextWeek',d,sl,m)} onAdd={i=>setModal({t:'add',...i})} onEdit={i=>setModal({t:'edit',...i})} onList={()=>setModal({t:'list'})}/>}
      {tab==='add'&&<div className="p-4 max-w-2xl"><h2 className="hd text-3xl mb-4">Add recipe</h2><RecipeForm submitLabel="Save recipe" allTags={allTags} onSave={saveRecipe}/></div>}
      {tab==='book'&&<Book recipes={s.recipes} onNew={()=>setTab('add')} onFav={toggleFav} onView={setView} onAdd={r=>setModal({t:'add',wk:'nextWeek',day:0,slot:'d',rid:r.id})} onEdit={r=>setModal({t:'recipe',r})} onDel={r=>setModal({t:'del',r})}/>}
    {tab==='combos'&&<Combos combos={s.combos||[]} onNew={()=>setModal({t:'combo',c:null})} onEdit={c=>setModal({t:'combo',c})} onDel={c=>setModal({t:'delc',c})} onAdd={c=>setModal({t:'add',wk:'nextWeek',day:0,slot:'d',cid:c.id})}/>}
    </main>
    <details className="box mt-3 px-3 py-2 text-xs">
      <summary className="u cursor-pointer">How to use</summary>
      <ul className="list-disc pl-5 space-y-1 mt-2">
        <li>Plan ahead on <b>Next Week</b>: tap + on a slot to pick a recipe or type a custom meal, then drag meals between days and slots.</li>
        <li>On Monday, next week’s menu becomes <b>This Week</b>. Today is highlighted; tap any meal to edit, move or remove it.</li>
        <li>Save dishes in <b>Add Recipe</b>. In the <b>Recipe Book</b>, use the calendar icon to add one to next week.</li>
        <li>Use <b>Combos</b> to group dishes into one block you can add to a menu in a single step.</li>
        <li>Tap <b>Shopping list</b> on Next Week to total the ingredients from your planned recipes.</li>
        <li>Everything saves automatically in this browser.</li>
      </ul>
    </details>
    {modal&&modal.t==='add'&&<AddModal init={modal} recipes={s.recipes} combos={s.combos||[]} onAdd={addMeal} onClose={close}/>}
    {modal&&modal.t==='edit'&&<EditModal init={modal} recipes={s.recipes} onView={setView} onClose={close} onDelete={()=>removeMeal(modal.wk,modal.day,modal.slot,modal.meal)} onSave={(d,sl,patch)=>moveMeal(modal.wk)(modal.day,modal.slot,modal.meal.id,d,sl,patch)}/>}
    {modal&&modal.t==='recipe'&&<Modal title="Edit recipe" onClose={close}><RecipeForm initial={modal.r} allTags={allTags} onHistory={setHistory} submitLabel="Save changes" onSave={r=>{saveRecipe(r);close();}} onCancel={close}/></Modal>}
    {modal&&modal.t==='del'&&<Modal title="Are you sure?" onClose={close}><p className="mb-4">Delete “{modal.r.name}” from your Recipe Book? Meals already on your menus will stay.</p><div className="flex justify-end gap-2"><button className="btn" onClick={close}>Cancel</button><button className="btn pri" onClick={()=>{delRecipe(modal.r.id);close();}}>Delete recipe</button></div></Modal>}
    {modal&&modal.t==='list'&&<ListModal week={s.nextWeek} recipes={s.recipes} onClose={close}/>}
    {modal&&modal.t==='print'&&<PrintView week={s.thisWeek} ws={s.weekStart} onClose={close}/>}
    {modal&&modal.t==='combo'&&<ComboModal init={modal.c} recipes={s.recipes} onSave={saveCombo} onClose={close}/>}
    {modal&&modal.t==='delc'&&<Modal title="Are you sure?" onClose={close}><p className="mb-4">Delete the combo “{modal.c.name}”? Menus that already use it will keep their meals.</p><div className="flex justify-end gap-2"><button className="btn" onClick={close}>Cancel</button><button className="btn pri" onClick={()=>{delCombo(modal.c.id);close();}}>Delete combo</button></div></Modal>}
    {view&&<RecipeView r={view} onClose={()=>setView(null)}/>}
    {toast&&<div role="status" className="box flex items-center gap-3 px-3 py-2" style={{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'calc(1rem + env(safe-area-inset-bottom,0px))',background:'var(--bg)',zIndex:80,boxShadow:'0 4px 12px rgba(0,0,0,.3)'}}>Meal removed.<button className="btn" onClick={undo}>Undo</button></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
